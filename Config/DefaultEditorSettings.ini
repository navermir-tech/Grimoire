; 프로젝트 공용 에디터 단축키 (엔진: InputBindingManager 의 ProjectDefinedChords).
; 사용자가 에디터 환경설정에서 직접 바꾼 단축키가 있으면 그쪽이 이긴다.
[ProjectDefinedChords]
; PIE 종료: Esc 단독으로는 끄지 않는다(게임 안에서 Esc 를 메뉴 등에 쓰기 위해).
; 주 단축키 Ctrl+Esc — 단, Windows 가 Ctrl+Esc 를 시작 메뉴로 가로챌 수 있다.
; 보조 단축키 Shift+Esc — Ctrl+Esc 가 막힐 때 쓴다.
+ProjectDefinedChords={"BindingContext":"PlayWorld","CommandName":"StopPlaySession","ChordIndex":0,"Control":true,"Alt":false,"Shift":false,"Command":false,"Key":"Escape"}
+ProjectDefinedChords={"BindingContext":"PlayWorld","CommandName":"StopPlaySession","ChordIndex":1,"Control":false,"Alt":false,"Shift":true,"Command":false,"Key":"Escape"}
