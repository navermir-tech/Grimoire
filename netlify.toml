# Netlify 배포 설정 — docs/ 의 VitePress 문서 사이트만 배포한다. 언리얼 프로젝트 빌드와는 무관하다.
[build]
  command = "npm run docs:build"
  publish = "docs/.vitepress/dist"
  # docs · package.json · netlify.toml 이 바뀌지 않은 커밋(언리얼 에셋만 바뀐 커밋)은 빌드를 건너뛴다.
  # 종료 코드 0 = 건너뜀, 그 외 = 빌드. 첫 배포(CACHED_COMMIT_REF 없음)는 명령이 실패해 빌드된다.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- docs/ package.json package-lock.json netlify.toml"

[build.environment]
  NODE_VERSION = "22"
